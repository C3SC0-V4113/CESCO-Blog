name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch or PR. Pushing twice in a minute
# used to leave the first, now-pointless run occupying a runner to completion.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One job per browser, run in parallel, so wall time is the slowest browser
    # rather than the sum of all three. Each job also installs only the browser
    # it needs instead of all three.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    name: test (${{ matrix.browser }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose. `packageManager` in package.json already
      # pins pnpm, and the action refuses to run when both are set.
      #
      # This action now points at pnpm/setup as its successor. Not migrated yet:
      # that project's v2 is days old, and swapping the action that installs the
      # package manager is not where to take that risk.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser binaries are cached per browser, keyed by the installed
      # @playwright/test version so a bump invalidates the cache on its own.
      # OS-level packages are not cacheable, so a cache hit still needs
      # `install-deps`.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}

      # Both of these reach an Ubuntu apt mirror, which occasionally crawls: a
      # firefox run once spent twenty minutes fetching a handful of codec
      # packages and was killed by the job timeout, with the suite never
      # starting. Bounding each attempt makes a bad mirror fail in minutes
      # instead of eating the whole budget, and the retry usually lands on a
      # healthy one. Slowness, not failure, is the mode to defend against here —
      # a bare retry without the timeout would never fire.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if timeout 600 pnpm exec playwright install --with-deps ${{ matrix.browser }}; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt failed or timed out; retrying"
            # Killing apt mid-run leaves dpkg half-configured, and every later
            # attempt then fails instantly with exit 100 rather than retrying
            # anything. Recover before trying again, or the retry is theatre.
            sudo dpkg --configure -a || true
            sudo apt-get --fix-broken install -y || true
            sleep 5
          done
          exit 1

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for attempt in 1 2 3; do
            if timeout 600 pnpm exec playwright install-deps ${{ matrix.browser }}; then
              exit 0
            fi
            echo "::warning::install-deps attempt $attempt failed or timed out; retrying"
            # Killing apt mid-run leaves dpkg half-configured, and every later
            # attempt then fails instantly with exit 100 rather than retrying
            # anything. Recover before trying again, or the retry is theatre.
            sudo dpkg --configure -a || true
            sudo apt-get --fix-broken install -y || true
            sleep 5
          done
          exit 1

      # No build, migrate or seed steps here on purpose. Playwright's `webServer`
      # runs `pnpm run e2e:serve`, which does all three before booting the built
      # Worker, so the suite runs identically here and on a developer's machine.
      # Retried **only** when the Worker died, never on a test failure.
      #
      # The Worker occasionally dies mid-run — an empty wrangler error, then
      # every remaining test failing on "Connection refused". A blanket retry
      # would hide real regressions behind a second roll of the dice, so the
      # rerun is gated on that signature appearing in the output. A genuine
      # failure exits on the first attempt exactly as before.
      #
      # One retry, not a loop: if the server dies twice the problem is not
      # flakiness and a green run bought on the third attempt would be a lie.
      - name: Run Playwright tests
        run: |
          set -o pipefail
          run() { pnpm exec playwright test --project=${{ matrix.browser }} 2>&1 | tee playwright-output.txt; }

          if run; then
            exit 0
          fi

          if grep -q "Connection refused" playwright-output.txt; then
            echo "::warning::The Worker died mid-run; retrying once. See the worker-logs artifact."
            run
            exit $?
          fi

          echo "Tests failed on their own merits — not retrying."
          exit 1

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          # Matrix jobs cannot share an artifact name.
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      # The Worker occasionally dies mid-run and every test after it fails on
      # "Connection refused". Playwright prints wrangler's error, and wrangler
      # prints an **empty** one — the detail goes to a log file that nothing was
      # collecting, so the only failure we cannot reproduce locally was also the
      # only one leaving no evidence behind.
      #
      # `if: failure()` rather than `!cancelled()`: on a green run this is noise.
      - name: Collect the Worker log
        if: ${{ failure() }}
        run: |
          mkdir -p worker-logs
          # Wrangler writes under XDG config; the path is stable but the file
          # name carries a timestamp, so copy whatever is there.
          cp -r ~/.config/.wrangler/logs/. worker-logs/ 2>/dev/null || true
          echo "--- collected ---"
          ls -la worker-logs/ || true

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: worker-logs-${{ matrix.browser }}
          path: worker-logs/
          retention-days: 7
          if-no-files-found: warn
